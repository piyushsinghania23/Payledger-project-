version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: payto
      POSTGRES_USER: payto
      POSTGRES_PASSWORD: payto_dev_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payto"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DEBUG: "False"
      SECRET_KEY: "django-insecure-dev-key-change-in-production"
      DATABASE_URL: "postgresql://payto:payto_dev_pass@db:5432/payto"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "python manage.py migrate && python manage.py seed_merchants && gunicorn payto.wsgi --bind 0.0.0.0:8000"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DEBUG: "False"
      SECRET_KEY: "django-insecure-dev-key-change-in-production"
      DATABASE_URL: "postgresql://payto:payto_dev_pass@db:5432/payto"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    command: celery -A payto worker -l info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DEBUG: "False"
      SECRET_KEY: "django-insecure-dev-key-change-in-production"
      DATABASE_URL: "postgresql://payto:payto_dev_pass@db:5432/payto"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    command: celery -A payto beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    environment:
      REACT_APP_API_URL: http://localhost:8000/api/v1
    command: npm start

volumes:
  postgres_data:
  postgres_data:
